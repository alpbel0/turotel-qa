[project]
name = "turotel"
version = "0.1.0"
description = "Turotel-QA: Turkish hotel-review aspect sentiment, complaint root-cause and action recommendation."
requires-python = ">=3.11,<3.12"
dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "neo4j>=5.20,<6",
    "pyarrow>=16",
    "python-dotenv>=1.0",
    "pgvector>=0.3",
]

[dependency-groups]
labeling = ["streamlit>=1.37"]
ml = ["scikit-learn>=1.5", "pandas>=2.2", "numpy>=1.26"]
causal = ["tigramite>=5.2", "numpy>=1.26", "pandas>=2.2"]
demo = ["gradio>=4.40"]
dev = ["pytest>=8.0"]

[tool.uv]
default-groups = ["dev"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/turotel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
